# Traefik static configuration for local plugin testing.

log:
  level: DEBUG

entryPoints:
  websecure:
    address: ":443"

experimental:
  localPlugins:
    traefik-sni-host-check:
      moduleName: github.com/DialogInsight/traefik-sni-host-check

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
