displayName: "SNI Host Check"
type: middleware
import: github.com/kumojin/traefik-sni

summary: |
  Compares the TLS SNI server name with the HTTP Host header and returns
  421 Misdirected Request when they do not match. Prevents domain fronting
  attacks where the SNI and Host header diverge.

testData:
  rejectOnMissingSNI: true
  rejectOnMissingHost: false
  logOnly: false
  logLevel: INFO
  logFilePath: ""
  logFormat: common
