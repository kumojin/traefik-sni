name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-style:
    name: test-style
    runs-on: ubuntu-latest
    concurrency:
      group: ci-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.4

  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    concurrency:
      group: ci-unit-tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v -race ./...

  test-e2e-vuln:
    name: "test-e2e - vulnerable"
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-e2e-vuln-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-traefik
        with:
          static-config: test/traefik.yml
          dynamic-config: test/traefik-dynamic-vulnerable.yml

      - name: Normal request to legit backend works
        run: |
          STATUS=$(curl -s -o /tmp/body -w '%{http_code}' --insecure --resolve legit.localhost:443:127.0.0.1 https://legit.localhost/)
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; cat /tmp/body; exit 1; }
          grep -q "Name: legit" /tmp/body || { echo "Expected 'Name: legit'"; cat /tmp/body; exit 1; }

      - name: "Domain fronting succeeds: SNI=legit, Host=victim reaches victim"
        run: |
          STATUS=$(curl -s -o /tmp/body -w '%{http_code}' --insecure --resolve legit.localhost:443:127.0.0.1 -H "Host: victim.localhost" https://legit.localhost/)
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; cat /tmp/body; exit 1; }
          grep -q "Name: victim" /tmp/body || { echo "Domain fronting should reach victim backend"; cat /tmp/body; exit 1; }

      - name: Dump Traefik logs on failure
        if: failure()
        run: docker logs sni-test-traefik

  test-e2e-prot:
    name: "test-e2e - protected"
    runs-on: ubuntu-latest
    concurrency:
      group: ci-test-e2e-prot-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-traefik
        with:
          static-config: test/traefik.yml
          dynamic-config: test/traefik-dynamic-protected.yml

      - name: Normal request to legit backend still works
        run: |
          STATUS=$(curl -s -o /tmp/body -w '%{http_code}' --insecure --resolve legit.localhost:443:127.0.0.1 https://legit.localhost/)
          [ "$STATUS" = "200" ] || { echo "Expected 200, got $STATUS"; cat /tmp/body; exit 1; }
          grep -q "Name: legit" /tmp/body || { echo "Expected 'Name: legit'"; cat /tmp/body; exit 1; }

      - name: "Domain fronting blocked: SNI=legit, Host=victim returns 421"
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --insecure --resolve legit.localhost:443:127.0.0.1 -H "Host: victim.localhost" https://legit.localhost/)
          [ "$STATUS" = "421" ] || { echo "Expected 421, got $STATUS"; docker logs sni-test-traefik; exit 1; }

      - name: Dump Traefik logs on failure
        if: failure()
        run: docker logs sni-test-traefik
